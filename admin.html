<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POP-AI — Quản trị</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-screen">
  <div class="card login-card" id="adminCard">

    <!-- Trạng thái: nhập mật khẩu -->
    <div id="passwordState">
      <div class="login-mark"><span></span></div>
      <h1>POP-AI — Quản trị</h1>
      <p class="section-gap">Nhập mật khẩu quản trị để tiếp tục.</p>

      <form id="passwordForm">
        <div class="field section-gap">
          <label for="adminPassword">Mật khẩu</label>
          <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="off" required autofocus>
        </div>
        <button type="submit" class="auth-submit-btn" id="unlockBtn">Vào trang quản trị</button>
        <p class="auth-error" id="passwordError"></p>
      </form>
    </div>

    <!-- Trạng thái: đã xác thực, hiển thị công cụ quản trị -->
    <div id="adminState" style="display:none;">
      <div class="login-mark"><span></span></div>
      <h1>POP-AI — Quản trị</h1>
      <p class="section-gap">Quản lý mã xác thực giáo viên — mã này giáo viên mới cần nhập khi đăng ký tài khoản để được cấp vai trò "giáo viên".</p>

      <div class="field section-gap">
        <label>Mã hiện tại</label>
        <div class="admin-code-row">
          <code id="currentCode">—</code>
          <button type="button" class="btn btn-ghost btn-sm" id="copyCodeBtn">Sao chép</button>
        </div>
        <p class="muted" id="currentCodeMeta"></p>
      </div>

      <form id="adminForm">
        <div class="field section-gap">
          <label for="newCode">Mã mới</label>
          <input type="text" id="newCode" placeholder="VD: GV2026-POPAI" autocomplete="off" required minlength="4">
        </div>

        <div class="auth-link-row" style="justify-content:flex-start;gap:10px;">
          <button type="button" class="btn btn-ghost btn-sm" id="genCodeBtn">Tạo ngẫu nhiên</button>
        </div>

        <button type="submit" class="auth-submit-btn section-gap" id="saveBtn">Lưu mã mới</button>
        <p class="auth-error" id="adminError"></p>
        <p class="auth-ok" id="adminOk"></p>
      </form>

      <div class="auth-link-row">
        <button type="button" id="lockBtn">Khoá lại trang</button>
      </div>
    </div>

  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
